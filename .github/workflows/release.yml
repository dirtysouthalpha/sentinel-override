# Sentinel Override — Auto Release
# Triggers when a version tag (v*) is pushed. Builds the zip and creates a GitHub release.
name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci || npm install

      # Run tests before releasing
      - name: Run Tests
        run: npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'

      # Extract version from manifest.json
      - name: Get Version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Build the distribution zip
      - name: Build Distribution Zip
        run: |
          python3 -c "
          import os, zipfile, json
          base = os.getcwd()
          version = '${{ steps.version.outputs.version }}'
          zip_name = f'sentinel-override-v{version}.zip'
          include = [
              'manifest.json', 'package.json', 'CHANGELOG.md',
              'popup.html', 'popup.css', 'popup-full.js',
              'popup-modules/', 'background/', 'content/', 'lib/', 'web/',
              'fonts/', 'icons/',
              'icon-16.png', 'icon-32.png', 'icon-48.png', 'icon-128.png', 'icon-256.png', 'icon.svg',
              'report-print.html', 'report-print.js', 'report-view.html', 'report-view.js'
          ]
          exclude_dirs = {'node_modules', 'tests', 'coverage', '.git', '__pycache__', 'dist', '.claude', 'docs', '.github'}
          exclude_exts = {'.test.js', '.spec.js'}
          count = 0
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              for item in include:
                  full = os.path.join(base, item)
                  if os.path.isfile(full):
                      zf.write(full, item)
                      count += 1
                  elif os.path.isdir(full):
                      for root, dirs, files in os.walk(full):
                          dirs[:] = [d for d in dirs if d not in exclude_dirs]
                          for fn in files:
                              if any(fn.endswith(ext) for ext in exclude_exts):
                                  continue
                              filepath = os.path.join(root, fn)
                              arcname = os.path.relpath(filepath, base)
                              zf.write(filepath, arcname)
                              count += 1
          print(f'Built {zip_name}: {count} files, {os.path.getsize(zip_name)/1024/1024:.2f} MB')
          "

      # Create GitHub release with the zip attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sentinel Override v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: sentinel-override-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
