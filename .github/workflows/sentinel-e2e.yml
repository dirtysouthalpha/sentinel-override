name: Sentinel Override E2E Test

on:
  pull_request:
    paths:
      - 'admin-portal/**'
      - 'frontend/**'
      - '**.html'
      - '**.js'
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sentinel-e2e:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Build extension
        run: npm run build
      
      - name: Load Chrome extension
        run: |
          # Install Chrome
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # Start Chrome with extension loaded
          google-chrome --load-extension=./dist --no-first-run --no-default-browser-check > /dev/null 2>&1 &
          CHROME_PID=$!
          echo "CHROME_PID=$CHROME_PID" >> $GITHUB_ENV
          
          # Wait for extension to load
          sleep 5
      
      - name: Check extension loaded
        run: |
          # Check if extension is loaded
          if ! pgrep -f "load-extension=./dist"; then
            echo "Extension failed to load"
            exit 1
          fi
          echo "Extension loaded successfully"
      
      - name: Wait for UAP server
        run: |
          # Wait for UAP server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "UAP server ready"
              exit 0
            fi
            sleep 2
          done
          echo "UAP server not ready"
          exit 1
      
      - name: Run Sentinel goal tests
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SENTINEL_TOKEN: ${{ secrets.SENTINEL_TOKEN }}
        run: |
          # Test 1: Basic navigation
          node scripts/sentinel-test.js \
            --goal "Navigate to example.com and verify page loads" \
            --expected "page loaded successfully"
          
          # Test 2: Form interaction
          node scripts/sentinel-test.js \
            --goal "Fill out the contact form with test data" \
            --expected "form submitted"
          
          # Test 3: Data extraction
          node scripts/sentinel-test.js \
            --goal "Extract all links from the page" \
            --expected "links extracted"
      
      - name: Assert tests passed
        run: |
          if [ -f sentinel-test-results.json ]; then
            cat sentinel-test-results.json
            
            # Check if all tests passed
            FAILED=$(node -e "
              const results = require('./sentinel-test-results.json');
              const failed = results.filter(r => !r.passed);
              console.log(failed.length);
            ")
            
            if [ "$FAILED" -gt 0 ]; then
              echo "❌ $FAILED test(s) failed"
              exit 1
            fi
            
            echo "✅ All tests passed"
          else
            echo "No test results found"
            exit 1
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sentinel-test-results
          path: |
            sentinel-test-results.json
            screenshots/
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          # Kill Chrome
          pkill -9 chrome || true
          
          # Clean up
          rm -rf screenshots/
