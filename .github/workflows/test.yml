# Sentinel Override — CI Test Gate
# Runs on every push to main and every PR. Blocks merge if any check fails.
name: Test Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci || npm install

      # ━━━ Step 1: Bare Import Scanner ━━━
      # Catches bare module specifiers that crash Chrome MV3 service workers
      - name: Bare Import Scanner
        run: |
          echo "Scanning for bare module imports..."
          # Match a bare specifier in either quote style (the codebase uses both;
          # the old single-quote-only scanner missed double-quoted bare imports).
          # A bare specifier starts with a letter/@ and has no spaces, so this also
          # naturally skips relative imports (./ ../) and the word "from" in prose.
          RESULTS=$(grep -rnE "from ['\"][a-zA-Z@][a-zA-Z0-9@/._-]*['\"]" background/ content/ popup-modules/ popup-full.js --include='*.js' \
            | grep -vE "from ['\"](chrome|crypto|node:)" \
            || true)
          if [ -n "$RESULTS" ]; then
            echo "FAIL: Bare module imports found"
            echo "$RESULTS"
            exit 1
          else
            echo "PASS: No bare imports detected"
          fi


      # ━━━ Step 1b: Import Resolution Checker ━━━
      # Catches missing named exports that crash Chrome MV3 service workers
      # (e.g. importing seedBuiltinTemplates when it was never exported)
      - name: Import Resolution Checker
        run: node scripts/check-imports.cjs
      # ━━━ Step 1b2: Manifest Validation ━━━
      # A malformed manifest.json makes the extension unloadable, and a version
      # that has drifted from package.json ships a mislabelled build. Neither is
      # caught anywhere else in this workflow.
      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error('expected manifest_version 3, got ' + manifest.manifest_version);
          if (manifest.version !== pkg.version) throw new Error('manifest.json version ' + manifest.version + ' != package.json ' + pkg.version);
          console.log('manifest.json valid, v' + manifest.version);
          "
      # ━━━ Step 1b3: Platform Registry Drift Gate ━━━
      # background/platforms/index.js is generated. A profile added without
      # regenerating would exist on disk but never match anything.
      - name: Platform Registry Up To Date
        run: node scripts/generate-platform-registry.cjs --check
      # ━━━ Step 1c: Module Loader Check ━━━
      # Catches runtime ReferenceErrors (stray characters, bare identifiers)
      # that node --check misses because it only validates syntax
      - name: Module Loader Check
        run: node scripts/check-module-load.cjs

      # ━━━ Step 1d: Lint ━━━
      # ESLint catches undeclared identifiers, const reassignment, and other
      # runtime-fatal mistakes that syntax-only checks miss. This gate was absent,
      # which is how a batch of ReferenceError bugs reached production.
      - name: Lint
        run: npm run lint

      # ━━━ Step 2: Syntax Check ━━━
      - name: Syntax Check
        run: |
          echo "Checking syntax of all JS files..."
          ERRORS=0
          while IFS= read -r file; do
            if ! node --check "$file" 2>/dev/null; then
              echo "SYNTAX ERROR: $file"
              node --check "$file" 2>&1 | head -5
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find background/ content/ popup-modules/ -name '*.js' ! -name '*.test.js' ! -name '*.spec.js')
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: $ERRORS files with syntax errors"
            exit 1
          else
            echo "PASS: All JS files have valid syntax"
          fi

      # ━━━ Step 2b: Web Dashboard Load Gate ━━━
      # web/ is plain browser pages with no build step, so nothing above ever
      # parsed them: the Syntax Check only walks background/ content/
      # popup-modules/, and dashboard-prime.html keeps its ~1000-line script
      # inline where `node --check` cannot reach it. This parses each page with
      # linkedom, compiles every inline script, and verifies the element ids the
      # scripts drive actually exist.
      - name: Web Dashboard Load Gate
        run: npm run test:web

      # ━━━ Step 2c: Client↔Server Contract Gate ━━━
      # The dashboards call servers that live in OTHER repos. On 2026-08-04 a
      # base constant was repointed at :8001 because a grep for `/__brain` in
      # THIS repo found nothing — the route is declared in sentinel-desktop.
      # Proving a route absent in one repo proves nothing.
      #
      # Route tables for sentinel-desktop, sentinel-prime-premium and neuralis
      # are frozen in contract/server-routes.json (CI cannot clone them; one is
      # private). `routes:check` is a no-op here and re-verifies freshness
      # wherever the siblings ARE checked out. `test:contract` is the real gate
      # and runs everywhere. Full assertions live in
      # tests/web-client-server-contract.test.js, run by Step 3.
      - name: Route Manifest Freshness
        run: npm run routes:check
      - name: Client-Server Contract Gate
        run: npm run test:contract

      # ━━━ Step 3: Test Suite ━━━
      - name: Test Suite
        run: npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
