# Sentinel Override E2E Test - GitLab CI

stages:
  - test
  - build
  - e2e

variables:
  CHROME_VERSION: "stable"
  NODE_VERSION: "18"

# Unit tests
test:unit:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

# Build extension
build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  only:
    - main
    - develop
    - merge_requests

# E2E tests with Sentinel
sentinel:e2e:
  stage: e2e
  image: node:${NODE_VERSION}
  services:
    - chrome:stable
  variables:
    ADMIN_URL: "https://admin.example.com"
    TEST_TENANT: "acme.onmicrosoft.com"
  script:
    # Install Chrome
    - apt-get update && apt-get install -y google-chrome-stable
    
    # Load extension
    - google-chrome --load-extension=./dist --no-first-run --no-default-browser-check > chrome.log 2>&1 &
    - CHROME_PID=$!
    - echo "Chrome PID: $CHROME_PID"
    
    # Wait for extension
    - sleep 10
    
    # Wait for UAP server
    - |
      for i in {1..30}; do
        if curl -s http://localhost:8000/health > /dev/null 2>&1; then
          echo "UAP server ready"
          break
        fi
        sleep 2
      done
    
    # Run E2E tests
    - |
      node scripts/sentinel-test.js \
        --url "$ADMIN_URL" \
        --tenant "$TEST_TENANT" \
        --goal "Login to admin portal and verify dashboard loads" \
        --expected "dashboard loaded" \
        --output sentinel-report.json
    
    # Verify results
    - |
      if [ -f sentinel-report.json ]; then
        RESULT=$(node -e "console.log(require('./sentinel-report.json').status)")
        if [ "$RESULT" != "success" ]; then
          echo "❌ E2E test failed"
          cat sentinel-report.json
          exit 1
        fi
        echo "✅ E2E test passed"
      else
        echo "No report generated"
        exit 1
      fi
  
  artifacts:
    reports:
      sentinel: sentinel-report.json
    paths:
      - sentinel-report.json
      - screenshots/
    expire_in: 1 week
  
  after_script:
    - pkill -9 chrome || true
    - cat chrome.log || true
  
  only:
    - main
    - develop
    - merge_requests

# Performance test
sentinel:performance:
  stage: e2e
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build
    - npm run test:performance
  artifacts:
    reports:
      performance: performance-report.json
    paths:
      - performance-report.json
    expire_in: 1 week
  only:
    - schedules
