<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Sentinel Override — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050608; --surface: #0A0C10; --surface-raised: #111418;
      --border: #3b494b; --border-subtle: rgba(255,255,255,0.08);
      --text: #e2e2e8; --text-dim: #849495; --text-bright: #b9cacb;
      --accent: #00F0FF; --accent-hover: #00c8d4;
      --green: #95E400; --red: #ff3b3b; --orange: #FBBC00;
      --font-headline: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Consolas', 'Monaco', 'Menlo', monospace;
    }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }

    .header { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--accent); }
    .header h1 { font-family: var(--font-headline); font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .header .version { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 0; padding: 20px; }
    .card:hover { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,240,255,0.1); }
    .card h2 { font-family: var(--font-headline); font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-family: var(--font-headline); font-size: 32px; font-weight: 700; }
    .card .sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; }
    .status-dot.green { background: var(--green); }
    .status-dot.red { background: var(--red); }
    .status-dot.orange { background: var(--orange); }

    .section { margin-bottom: 32px; }
    .section h2 { font-family: var(--font-headline); font-size: 14px; margin-bottom: 16px; letter-spacing: 0.5px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
    th { color: var(--text-dim); font-weight: 500; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { color: var(--text); }
    tr:hover td { background: rgba(0,240,255,0.02); }

    .badge { padding: 2px 8px; border-radius: 0; font-size: 11px; font-family: var(--font-mono); font-weight: 600; border: 1px solid; }
    .badge.green { background: rgba(149,228,0,0.08); color: var(--green); border-color: var(--green); }
    .badge.red { background: rgba(255,59,59,0.08); color: var(--red); border-color: var(--red); }
    .badge.orange { background: rgba(251,188,0,0.08); color: var(--orange); border-color: var(--orange); }

    .btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 0; background: transparent; color: var(--text); cursor: pointer; font-size: 12px; font-family: var(--font-headline); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.2s; }
    .btn:hover { background: var(--surface-raised); border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
    .btn.primary:hover { background: var(--accent-hover); }

    .empty { text-align: center; padding: 40px; color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; }

    #goal-form { display: flex; gap: 8px; margin-bottom: 24px; }
    #goal-input { flex: 1; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 0; color: var(--text); font-size: 14px; font-family: var(--font-body); }
    #goal-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px rgba(0,240,255,0.2); }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .header { padding: 16px; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Sentinel Override</h1>
      <div class="version">v15.0.0 — Dashboard</div>
    </div>
    <div>
      <span class="status-dot green"></span>
      <span id="connection-status">Connected</span>
    </div>
  </div>

  <div class="container">
    <!-- Goal Input -->
    <form id="goal-form">
      <input type="text" id="goal-input" placeholder="Enter a goal for the agent..." />
      <button type="submit" class="btn primary">Run</button>
    </form>

    <!-- Stats Cards -->
    <div class="grid">
      <div class="card">
        <h2>Total Runs</h2>
        <div class="value" id="stat-runs">—</div>
        <div class="sub">lifetime</div>
      </div>
      <div class="card">
        <h2>Active Runs</h2>
        <div class="value" id="stat-active">0</div>
        <div class="sub">concurrent</div>
      </div>
      <div class="card">
        <h2>API Health</h2>
        <div class="value" id="stat-health">—</div>
        <div class="sub" id="stat-health-sub">checking...</div>
      </div>
      <div class="card">
        <h2>Est. Cost</h2>
        <div class="value" id="stat-cost">$0.00</div>
        <div class="sub">this session</div>
      </div>
    </div>

    <!-- Recent Runs -->
    <div class="section">
      <h2>Recent Runs</h2>
      <table>
        <thead>
          <tr><th>Goal</th><th>Status</th><th>Steps</th><th>Duration</th><th>Time</th></tr>
        </thead>
        <tbody id="runs-table">
          <tr><td colspan="5" class="empty">No runs yet</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Playbooks -->
    <div class="section">
      <h2>Learned Playbooks</h2>
      <table>
        <thead>
          <tr><th>Platform</th><th>Trigger</th><th>Runs</th><th>Success Rate</th><th>Last Used</th></tr>
        </thead>
        <tbody id="playbooks-table">
          <tr><td colspan="5" class="empty">No playbooks learned yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
